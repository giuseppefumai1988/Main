  =============================================================
  ANIQRC — blocco SEO da inserire dentro <head> di index.html
  =============================================================

  1) Il tag <link rel="canonical"> va replicato in OGNI pagina,
     cambiando ogni volta l'URL con quello della pagina stessa
     (es. https://aniqrc.it/toolkit.html su toolkit.html).

  2) Il blocco JSON-LD va inserito SOLO nella home (index.html).

     tecnica al fatto che i motori correggono "ANIQRC" in "Aniq".

  3) Correggere anche og:image, che oggi è un percorso relativo:
     va indicato in forma assoluta, altrimenti l'anteprima non
     viene generata da LinkedIn, WhatsApp e Facebook.
  =============================================================
-->
