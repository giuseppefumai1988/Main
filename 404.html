<!DOCTYPE html>

<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#FFFFFF;color:#12263A;font-family: var(--font-text);line-height:1.6;

  p{color:#2B3645;margin-bottom:32px}
  .actions{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
  a.btn{display:inline-block;padding:13px 24px;border-radius:0;text-decoration:none;
        font-weight:600;font-size:15px;transition:.2s}
  .primary{background:#E63946;color:#FFFFFF}
  .primary:hover{background:#C0202E}
  .ghost{border:1px solid #D6D9DE;color:#12263A}
  .ghost:hover{border-color:#12263A}

<link rel="preload" href="/inter-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
